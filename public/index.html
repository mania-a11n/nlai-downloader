<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استخراج‌کننده صفحات کتابخانه ملی</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f8fafc; margin: 0; padding: 16px; color: #0f172a; }
    .container { max-width: 900px; margin: 0 auto; }
    
    .header-card { background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 24px; text-align: center; }
    h2 { margin-top: 0; color: #1e293b; font-size: 22px; }
    p { font-size: 14px; color: #64748b; margin-bottom: 20px; }
    
    .input-wrapper { display: flex; gap: 10px; max-width: 600px; margin: 0 auto; }
    input[type="text"] { flex: 1; padding: 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 14px; text-align: left; dir: ltr; transition: border-color 0.2s; outline: none; }
    input[type="text"]:focus { border-color: #3b82f6; }
    
    .btn-main { padding: 14px 24px; background: #3b82f6; color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; white-space: nowrap; transition: background 0.2s; }
    .btn-main:hover { background: #2563eb; }
    .btn-main:disabled { background: #94a3b8; cursor: not-allowed; }

    /* شبکه صفحات */
    .grid-section { display: none; background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .grid-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; }
    .grid-title { font-size: 16px; font-weight: bold; color: #334155; }
    
    .page-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; }
    
    .page-card { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 10px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; text-decoration: none; color: inherit; transition: all 0.2s ease; }
    .page-card:hover { border-color: #3b82f6; background: #eff6ff; transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.1); }
    
    .page-icon { font-size: 28px; margin-bottom: 8px; filter: grayscale(1); transition: filter 0.2s; }
    .page-card:hover .page-icon { filter: grayscale(0); }
    
    .page-num { font-size: 14px; font-weight: 700; color: #334155; }
    .page-action { font-size: 11px; color: #3b82f6; margin-top: 6px; opacity: 0; transition: opacity 0.2s; font-weight: bold; }
    .page-card:hover .page-action { opacity: 1; }

    .error { color: #ef4444; font-size: 14px; text-align: center; margin-top: 16px; padding: 10px; background: #fef2f2; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-card">
      <h2>استخراج‌کننده لینک مستقیم اسناد</h2>
      <p>لینک سند کتابخانه ملی را وارد کنید تا لینک کیفیت اصلی تمام صفحات ساخته شود</p>
      
      <div class="input-wrapper">
        <input type="text" id="urlInput" placeholder="https://dl.nlai.ir/UI/Controls/ImageForm.aspx?ID=..." />
        <button class="btn-main" id="fetchBtn" onclick="processDocument()">ساخت لیست صفحات</button>
      </div>

      <div id="errorBox" class="error"></div>
    </div>

    <div id="gridSection" class="grid-section">
      <div class="grid-header">
        <span class="grid-title">تعداد کل صفحات شناسایی‌شده: <span id="totalCount" style="color:#3b82f6;font-size:18px;">0</span></span>
      </div>
      <div class="page-grid" id="pageGrid"></div>
    </div>
  </div>

  <script>
    async function processDocument() {
      const inputUrl = document.getElementById('urlInput').value.trim();
      const errorBox = document.getElementById('errorBox');
      const fetchBtn = document.getElementById('fetchBtn');
      const gridSection = document.getElementById('gridSection');
      const pageGrid = document.getElementById('pageGrid');

      if (!inputUrl) {
        showError('لطفاً لینک را در کادر وارد کنید.');
        return;
      }

      // Reset UI
      errorBox.style.display = 'none';
      fetchBtn.disabled = true;
      fetchBtn.innerText = 'در حال جستجوی صفحات...';
      gridSection.style.display = 'none';
      pageGrid.innerHTML = '';

      try {
        const apiUrl = `/.netlify/functions/download?url=${encodeURIComponent(inputUrl)}`;
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || 'خطا در ارتباط با سرور.');
        }

        const { cid, docId, totalPages, isEstimated } = data;
        
        document.getElementById('totalCount').innerText = isEstimated ? `${totalPages} (تخمینی)` : totalPages;

        // ساخت کارت‌ها
        for (let pn = 1; pn <= totalPages; pn++) {
          // ساخت لینک نهایی و مستقیم برای باز شدن در سایت کتابخانه ملی
          let directUrl = `https://dl.nlai.ir/UI/Forms/DisplayImage.aspx?cid=${cid}&pn=${pn}`;
          if (docId) {
            directUrl += `&id=${docId}&db=false`;
          }

          const card = document.createElement('a');
          card.className = 'page-card';
          card.href = directUrl;
          card.target = '_blank'; // باز شدن در تب جدید
          card.rel = 'noopener noreferrer';

          card.innerHTML = `
            <div class="page-icon">🖼️</div>
            <div class="page-num">صفحه ${pn}</div>
            <div class="page-action">مشاهده کیفیت اصلی ↗</div>
          `;
          
          pageGrid.appendChild(card);
        }

        gridSection.style.display = 'block';

      } catch (err) {
        showError(err.message);
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.innerText = 'ساخت لیست صفحات';
      }
    }

    function showError(msg) {
      const err = document.getElementById('errorBox');
      err.innerText = msg;
      err.style.display = 'block';
    }
  </script>
</body>
</html>
