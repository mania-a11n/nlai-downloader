<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نمایشگر اسناد کتابخانه ملی</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --purple: #7c3aed;
      --purple-hover: #6d28d9;
      --emerald: #059669;
      --emerald-hover: #047857;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, 'Segoe UI', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin-top: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      text-align: center;
      color: #0f172a;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      direction: ltr;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-primary { background-color: var(--primary); }
    .btn-primary:hover { background-color: var(--primary-hover); }

    .btn-info { background-color: var(--purple); }
    .btn-info:hover { background-color: var(--purple-hover); }

    .btn-secondary { background-color: var(--emerald); }
    .btn-secondary:hover { background-color: var(--emerald-hover); }

    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .page-indicator {
      font-weight: bold;
      padding: 6px 12px;
      background: #e2e8f0;
      border-radius: 6px;
      min-width: 130px;
      text-align: center;
      font-size: 0.9rem;
    }

    .image-container {
      text-align: center;
      margin-top: 20px;
      background: #f1f5f9;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 16px;
      min-height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-container img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    .error {
      color: #dc2626;
      font-size: 0.9rem;
      margin-top: 8px;
      font-weight: 500;
    }

    .link-info {
      font-size: 0.8rem;
      color: #64748b;
      word-break: break-all;
      margin-top: 12px;
      text-align: center;
      direction: ltr;
    }

    .link-info a { color: var(--primary); }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>نمایشگر اسناد کتابخانه ملی</h1>

      <!-- کادر ورود لینک -->
      <div class="input-group">
        <input type="text" id="urlInput" placeholder="لینک ImageForm را اینجا وارد کنید..." />
        <button id="loadBtn" class="btn-primary">نمایش تصویر</button>
      </div>
      <div id="errorMsg" class="error"></div>

      <!-- بخش نمایش عکس و کنترل‌ها -->
      <div id="viewerSection" style="display: none;">
        <div class="controls">
          <div class="nav-buttons">
            <button id="nextBtn" class="btn-primary">صفحه بعدی (Next)</button>
            <span class="page-indicator">
              صفحه <span id="pageDisplay">1</span> <span id="totalPagesDisplay"></span>
            </span>
            <button id="prevBtn" class="btn-primary">صفحه قبلی (Back)</button>
          </div>
          
          <div class="action-buttons">
            <button id="infoBtn" class="btn-info">توضیحات سند 📋</button>
            <button id="openTabBtn" class="btn-secondary">باز کردن عکس در تب جدید ↗</button>
          </div>
        </div>

        <div class="image-container">
          <img id="docImage" src="" alt="در حال بارگذاری..." />
        </div>

        <div class="link-info" id="directLink"></div>
      </div>
    </div>
  </div>

  <script>
    let currentId = '';
    let currentPage = 1;
    let totalPages = null;

    function extractId(url) {
      try {
        const urlObj = new URL(url.trim());
        const params = new URLSearchParams(urlObj.search);
        return params.get('ID') || params.get('id') || params.get('cid') || params.get('ids');
      } catch (e) {
        return null;
      }
    }

    function buildImageUrl(id, page) {
      return `https://dl.nlai.ir/UI/Forms/DisplayImage.aspx?id=${id}&db=false&pn=${page}&cid=${id}`;
    }

    function buildInfoUrl(id) {
      return `https://dl.nlai.ir/UI/Forms/Compare.aspx?ids=${id}`;
    }

    // دریافت خودکار تعداد کل صفحات از طریق Proxy
    async function fetchTotalPages(id) {
      const totalDisp = document.getElementById('totalPagesDisplay');
      totalDisp.innerText = '(در حال محاسبه...)';
      totalPages = null;

      const targetUrl = `https://dl.nlai.ir/UI/Forms/Compare.aspx?ids=${id}`;
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error('Network error');
        const htmlText = await response.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');

        // یافتن منوی کشویی یا عناصر حاوی تعداد صفحات در Compare.aspx
        const pageOptions = doc.querySelectorAll('select option, #ddlPages option, .page-count');
        
        if (pageOptions && pageOptions.length > 0) {
          totalPages = pageOptions.length;
        } else {
          // در صورت عدم یافتن گزینه منو، جستجو در متن HTML
          const match = htmlText.match(/از\s*(\d+)/) || htmlText.match(/Total\s*:\s*(\d+)/i);
          if (match) totalPages = parseInt(match[1]);
        }

        if (totalPages) {
          totalDisp.innerText = `از ${totalPages}`;
        } else {
          totalDisp.innerText = '';
        }
      } catch (e) {
        console.warn('امکان محاسبه تعداد صفحات وجود نداشت:', e);
        totalDisp.innerText = '';
      }
    }

    function loadDocument() {
      const input = document.getElementById('urlInput').value;
      const errorDiv = document.getElementById('errorMsg');
      errorDiv.innerText = '';

      const extractedId = extractId(input);
      if (!extractedId) {
        errorDiv.innerText = 'خطا: شناسه (ID) از لینک وارد شده استخراج نشد. لطفاً آدرس را بررسی کنید.';
        return;
      }

      currentId = extractedId;
      currentPage = 1;
      updateViewer();
      document.getElementById('viewerSection').style.display = 'block';

      // استخراج تعداد کل صفحات به صورت هم‌زمان
      fetchTotalPages(currentId);
    }

    function changePage(delta) {
      if (currentPage + delta < 1) return;
      if (totalPages && currentPage + delta > totalPages) return;
      currentPage += delta;
      updateViewer();
    }

    function updateViewer() {
      const imgUrl = buildImageUrl(currentId, currentPage);
      const imgElem = document.getElementById('docImage');
      const pageDisp = document.getElementById('pageDisplay');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const directLink = document.getElementById('directLink');

      imgElem.src = imgUrl;
      pageDisp.innerText = currentPage;
      
      prevBtn.disabled = currentPage <= 1;
      if (totalPages) {
        nextBtn.disabled = currentPage >= totalPages;
      } else {
        nextBtn.disabled = false;
      }

      directLink.innerHTML = `آدرس تصویر جاری: <a href="${imgUrl}" target="_blank" rel="noopener noreferrer">${imgUrl}</a>`;
    }

    function openInNewTab() {
      if (!currentId) return;
      const imgUrl = buildImageUrl(currentId, currentPage);
      window.open(imgUrl, '_blank');
    }

    function openInfoInNewTab() {
      if (!currentId) return;
      const infoUrl = buildInfoUrl(currentId);
      window.open(infoUrl, '_blank');
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('loadBtn').addEventListener('click', loadDocument);
      document.getElementById('infoBtn').addEventListener('click', openInfoInNewTab);
      document.getElementById('nextBtn').addEventListener('click', () => changePage(1));
      document.getElementById('prevBtn').addEventListener('click', () => changePage(-1));
      document.getElementById('openTabBtn').addEventListener('click', openInNewTab);

      document.getElementById('urlInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loadDocument();
      });
    });
  </script>

</body>
</html>
