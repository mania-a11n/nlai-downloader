<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نمایشگر اسناد کتابخانه ملی</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --purple: #7c3aed;
      --purple-hover: #6d28d9;
      --emerald: #059669;
      --emerald-hover: #047857;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, 'Segoe UI', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin-top: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      text-align: center;
      color: #0f172a;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 36px 12px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      direction: ltr;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      padding: 4px 6px;
      line-height: 1;
      border-radius: 50%;
      display: none;
      transition: color 0.2s, background-color 0.2s;
    }

    .clear-btn:hover {
      color: #ef4444;
      background-color: #fee2e2;
    }

    button.btn-primary { background-color: var(--primary); color: white; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: background 0.2s; }
    button.btn-primary:hover { background-color: var(--primary-hover); }

    .btn-info { background-color: var(--purple); color: white; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: background 0.2s; }
    .btn-info:hover { background-color: var(--purple-hover); }

    .btn-secondary { background-color: var(--emerald); color: white; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: background 0.2s; }
    .btn-secondary:hover { background-color: var(--emerald-hover); }

    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .page-indicator {
      font-weight: bold;
      padding: 6px 12px;
      background: #e2e8f0;
      border-radius: 6px;
      min-width: 140px;
      text-align: center;
      font-size: 0.9rem;
    }

    .image-container {
      text-align: center;
      margin-top: 15px;
      background: #f1f5f9;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 16px;
      min-height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-container img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    .error {
      color: #dc2626;
      font-size: 0.9rem;
      margin-top: 8px;
      font-weight: 500;
    }

    .status-badge {
      font-size: 0.85rem;
      color: #334155;
      background: #f1f5f9;
      padding: 6px 12px;
      border-radius: 6px;
      margin-top: 12px;
      text-align: center;
      font-weight: 500;
    }

    .link-info {
      font-size: 0.8rem;
      color: #64748b;
      word-break: break-all;
      margin-top: 12px;
      text-align: center;
      direction: ltr;
    }

    .link-info a { color: var(--primary); }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>نمایشگر اسناد کتابخانه ملی</h1>

      <!-- کادر ورود لینک همراه با دکمه پاک کردن -->
      <div class="input-group">
        <div class="input-wrapper">
          <input type="text" id="urlInput" placeholder="لینک ImageForm را اینجا پیست کنید..." />
          <button id="clearBtn" class="clear-btn" title="پاک کردن متن">✕</button>
        </div>
        <button id="loadBtn" class="btn-primary">نمایش تصویر</button>
      </div>
      <div id="errorMsg" class="error"></div>

      <!-- بخش نمایش عکس و کنترل‌ها -->
      <div id="viewerSection" style="display: none;">
        <div class="controls">
          <div class="nav-buttons">
            <button id="nextBtn" class="btn-primary">صفحه بعدی (Next)</button>
            <span class="page-indicator">
              صفحه <span id="pageDisplay">1</span> <span id="totalPagesDisplay"></span>
            </span>
            <button id="prevBtn" class="btn-primary">صفحه قبلی (Back)</button>
          </div>
          
          <div class="action-buttons">
            <button id="infoBtn" class="btn-info">توضیحات سند 📋</button>
            <button id="openTabBtn" class="btn-secondary">باز کردن عکس در تب جدید ↗</button>
          </div>
        </div>

        <div id="statusBadge" class="status-badge"></div>

        <div class="image-container">
          <img id="docImage" src="" alt="در حال بارگذاری..." />
        </div>

        <div class="link-info" id="directLink"></div>
      </div>
    </div>
  </div>

  <script>
    let currentId = '';
    let currentPage = 1;
    let totalPages = null;
    let isDetecting = false;

    function extractId(url) {
      try {
        const urlObj = new URL(url.trim());
        const params = new URLSearchParams(urlObj.search);
        return params.get('ID') || params.get('id') || params.get('cid') || params.get('ids');
      } catch (e) {
        return null;
      }
    }

    function buildImageUrl(id, page) {
      return `https://dl.nlai.ir/UI/Forms/DisplayImage.aspx?id=${id}&db=false&pn=${page}&cid=${id}`;
    }

    function buildInfoUrl(id) {
      return `https://dl.nlai.ir/UI/Forms/Compare.aspx?ids=${id}`;
    }

    function checkImageExists(id, page) {
      return new Promise((resolve) => {
        const img = new Image();
        const timer = setTimeout(() => {
          img.src = '';
          resolve(false);
        }, 4000);

        img.onload = () => {
          clearTimeout(timer);
          if (img.naturalWidth > 30 && img.naturalHeight > 30) {
            resolve(true);
          } else {
            resolve(false);
          }
        };

        img.onerror = () => {
          clearTimeout(timer);
          resolve(false);
        };

        img.src = buildImageUrl(id, page);
      });
    }

    async function autoDetectTotalPages(id) {
      if (isDetecting) return;
      isDetecting = true;

      const totalDisp = document.getElementById('totalPagesDisplay');
      const statusBadge = document.getElementById('statusBadge');
      totalDisp.innerText = '(در حال شمارش...)';
      statusBadge.innerText = 'در حال محاسبه و شمارش تعداد کل عکس‌های موجود...';

      let foundViaProxy = await tryFetchViaProxies(id);
      if (foundViaProxy) {
        totalPages = foundViaProxy;
        totalDisp.innerText = `از ${totalPages}`;
        statusBadge.innerText = `تعداد کل عکس‌های موجود: ${totalPages} عدد`;
        isDetecting = false;
        updateNavState();
        return;
      }

      try {
        let low = 1;
        let high = 1;

        while (await checkImageExists(id, high)) {
          low = high;
          high *= 2;
          if (high > 1000) break;
        }

        if (low === 1 && !(await checkImageExists(id, 1))) {
          totalDisp.innerText = '';
          statusBadge.innerText = '';
          isDetecting = false;
          return;
        }

        let lastValid = low;
        let start = low;
        let end = high;

        while (start <= end) {
          let mid = Math.floor((start + end) / 2);
          statusBadge.innerText = `در حال تست وجود صفحه ${mid}...`;
          let exists = await checkImageExists(id, mid);

          if (exists) {
            lastValid = mid;
            start = mid + 1;
          } else {
            end = mid - 1;
          }
        }

        totalPages = lastValid;
        totalDisp.innerText = `از ${totalPages}`;
        statusBadge.innerText = `شمارش تکمیل شد. تعداد کل عکس‌های موجود: ${totalPages} عدد`;
      } catch (e) {
        console.error('خطا در محاسبه صفحات:', e);
        totalDisp.innerText = '';
        statusBadge.innerText = '';
      }

      isDetecting = false;
      updateNavState();
    }

    async function tryFetchViaProxies(id) {
      const targetUrl = buildInfoUrl(id);
      const proxies = [
        `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
      ];

      for (let proxy of proxies) {
        try {
          const res = await fetch(proxy, { signal: AbortSignal.timeout(3000) });
          if (!res.ok) continue;
          let htmlText = '';
          if (proxy.includes('allorigins')) {
            const json = await res.json();
            htmlText = json.contents || '';
          } else {
            htmlText = await res.text();
          }

          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, 'text/html');
          const options = doc.querySelectorAll('select option, #ddlPages option');
          if (options && options.length > 0) return options.length;

          const match = htmlText.match(/از\s*(\d+)/) || htmlText.match(/تعداد\s*:\s*(\d+)/);
          if (match) return parseInt(match[1]);
        } catch (e) {
          // پروکسی بعدی
        }
      }
      return null;
    }

    function loadDocument() {
      const input = document.getElementById('urlInput').value;
      const errorDiv = document.getElementById('errorMsg');
      errorDiv.innerText = '';

      const extractedId = extractId(input);
      if (!extractedId) {
        return false;
      }

      if (extractedId === currentId && document.getElementById('viewerSection').style.display !== 'none') {
        return true;
      }

      currentId = extractedId;
      currentPage = 1;
      totalPages = null;
      updateViewer();
      document.getElementById('viewerSection').style.display = 'block';

      autoDetectTotalPages(currentId);
      return true;
    }

    function changePage(delta) {
      if (currentPage + delta < 1) return;
      if (totalPages && currentPage + delta > totalPages) return;
      currentPage += delta;
      updateViewer();
    }

    function updateNavState() {
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      prevBtn.disabled = currentPage <= 1;
      if (totalPages) {
        nextBtn.disabled = currentPage >= totalPages;
      } else {
        nextBtn.disabled = false;
      }
    }

    function updateViewer() {
      const imgUrl = buildImageUrl(currentId, currentPage);
      const imgElem = document.getElementById('docImage');
      const pageDisp = document.getElementById('pageDisplay');
      const directLink = document.getElementById('directLink');

      imgElem.src = imgUrl;
      pageDisp.innerText = currentPage;
      updateNavState();

      directLink.innerHTML = `آدرس تصویر جاری: <a href="${imgUrl}" target="_blank" rel="noopener noreferrer">${imgUrl}</a>`;
    }

    function openInNewTab() {
      if (!currentId) return;
      const imgUrl = buildImageUrl(currentId, currentPage);
      window.open(imgUrl, '_blank');
    }

    function openInfoInNewTab() {
      if (!currentId) return;
      const infoUrl = buildInfoUrl(currentId);
      window.open(infoUrl, '_blank');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const urlInput = document.getElementById('urlInput');
      const clearBtn = document.getElementById('clearBtn');

      function toggleClearBtn() {
        clearBtn.style.display = urlInput.value.trim() ? 'block' : 'none';
      }

      function handleAutoLoad() {
        toggleClearBtn();
        const val = urlInput.value.trim();
        if (val) {
          const id = extractId(val);
          if (id) {
            document.getElementById('errorMsg').innerText = '';
            loadDocument();
          }
        }
      }

      urlInput.addEventListener('input', handleAutoLoad);
      urlInput.addEventListener('paste', () => {
        setTimeout(handleAutoLoad, 100);
      });

      clearBtn.addEventListener('click', () => {
        urlInput.value = '';
        clearBtn.style.display = 'none';
        document.getElementById('errorMsg').innerText = '';
        urlInput.focus();
      });

      document.getElementById('loadBtn').addEventListener('click', () => {
        const success = loadDocument();
        if (!success) {
          document.getElementById('errorMsg').innerText = 'خطا: شناسه (ID) از لینک وارد شده استخراج نشد. لطفاً آدرس را بررسی کنید.';
        }
      });

      document.getElementById('infoBtn').addEventListener('click', openInfoInNewTab);
      document.getElementById('nextBtn').addEventListener('click', () => changePage(1));
      document.getElementById('prevBtn').addEventListener('click', () => changePage(-1));
      document.getElementById('openTabBtn').addEventListener('click', openInNewTab);

      urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleAutoLoad();
      });
    });
  </script>

</body>
</html>
